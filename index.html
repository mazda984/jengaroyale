<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Jenga: Afet Yönetimi</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0b0f19; font-family: sans-serif; }
        canvas { display: block; }
        
        /* Giriş Menüsü */
        #menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; color: white;
        }
        .btn {
            padding: 12px 24px; font-size: 18px; margin: 10px; cursor: pointer;
            border: none; border-radius: 5px; background: #0ea5e9; color: white; font-weight: bold;
        }
        .btn:hover { background: #0284c7; }
        input { padding: 12px; font-size: 18px; border-radius: 5px; border: none; text-align: center; margin-bottom: 10px; }

        /* Oyun Arayüzü */
        #bilgi {
            position: absolute; top: 10px; left: 10px; color: white;
            background: rgba(0,0,0,0.85); padding: 15px; border-radius: 5px;
            font-size: 14px; line-height: 1.5; pointer-events: none;
        }
        #afetUyarisi {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            color: #ef4444; font-family: 'Arial Black', sans-serif; font-size: 28px;
            background: rgba(0,0,0,0.7); padding: 10px 30px; border-radius: 10px;
            display: none; text-shadow: 2px 2px #000; box-shadow: 0 0 15px #ef4444;
            z-index: 5; animation: blink 1s infinite;
        }
        #olumEkrani {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 0, 0, 0.6); color: white; font-family: 'Arial Black', sans-serif;
            font-size: 60px; display: none; justify-content: center; align-items: center; z-index: 10;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <div id="menu">
        <h1>🧱 MULTIPLAYER JENGA: AFETLER</h1>
        <button class="btn" onclick="odaOlustur()">Oda Oluştur (Kod Al)</button>
        <p>veya var olan bir odaya katıl:</p>
        <input type="text" id="odaKoduInput" placeholder="5 Haneli Kod Girin">
        <button class="btn" style="background:#22c55e" onclick="odayaKatil()">Odaya Katıl</button>
        <p id="menuDurum" style="color:#ef4444; font-weight: bold; margin-top: 15px;"></p>
    </div>

    <div id="afetUyarisi">⚠️ DİKKAT: AFET YAKLAŞIYOR! ⚠️</div>

    <div id="bilgi">
        <strong>Oda Kodu: <span id="gostergeKodu" style="color:#22c55e">-----</span></strong><br>
        • Rolünüz: <span id="gostergeRol">Bekleniyor...</span><br>
        • Kontroller: WASD / Yön Tuşları<br>
        • <span style="color:#f59e0b; font-weight:bold;">AFETLERE KARŞI HAYATTA KAL!</span>
    </div>

    <div id="olumEkrani">ELENDİNİZ! 💀</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>

    <script>
        const socket = io(window.location.origin); 
        let benimRolum = null, oyunBasladi = false;

        function odaOlustur() { socket.emit('odaOlustur'); }
        function odayaKatil() {
            const kod = document.getElementById('odaKoduInput').value;
            if(kod.trim() !== "") socket.emit('odayaKatil', kod);
        }

        socket.on('odaOlusturuldu', (data) => {
            document.getElementById('menuDurum').innerText = "Arkadaş bekleniyor...";
            document.getElementById('gostergeKodu').innerText = data.odaKodu;
            benimRolum = data.oyuncuTipi;
            document.getElementById('gostergeRol').innerText = "Ev Sahibi (Mavi)";
        });

        socket.on('oyunBasladi', (oyuncular) => {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('bilgi').style.display = 'block';
            oyunBasladi = true;

            if (benimRolum === 'player1') {
                rakipMesh.material.color.setHex(0xec4899);
                scene.add(rakipMesh);
                // Ev sahibi afet döngüsünü başlatır
                setTimeout(afetYonetici, 5000);
            } else {
                benimRolum = 'player2';
                document.getElementById('gostergeRol').innerText = "Misafir (Pembe)";
                document.getElementById('gostergeKodu').innerText = document.getElementById('odaKoduInput').value.toUpperCase();
                playerMesh.material.color.setHex(0xec4899);
                rakipMesh.material.color.setHex(0x0ea5e9);
                scene.add(rakipMesh);
            }
            oyuncuReset();
        });

        socket.on('oyuncuHareketEtti', (data) => { if(oyunBasladi) rakipMesh.position.set(data.x, data.y, data.z); });
        socket.on('hata', (m) => { document.getElementById('menuDurum').innerText = m; });
        socket.on('oyuncuAyrildi', () => { alert("Rakip ayrıldı!"); location.reload(); });

        // --- AFET SENKRONİZASYONU ---
        socket.on('afetTetikle', (data) => {
            uyariGoster(data.isim);
            if (data.isim === "DEPREM") depremEfekti(data.guc);
            if (data.isim === "METEOR") meteorFirlat(data.x, data.z);
        });

        // --- THREE.JS KURULUMU (TEXTURE VE GÖLGELENDİRME) ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020617); // Uzay/Gece atmosferi
        scene.fog = new THREE.FogExp2(0x020617, 0.015); // Derinlik hissi için sis efekti

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Gölgeleri açtık!
        document.body.appendChild(renderer.domElement);

        // Gelişmiş Işıklandırma (Gölgeli ve Texture derinliği sağlayan ışıklar)
        const ambientLight = new THREE.AmbientLight(0x334155, 0.8);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xfef08a, 1.2); // Güneş/Meteor ışığı rengi
        dirLight.position.set(40, 80, 30);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // FİZİK KURULUMU
        const world = new CANNON.World();
        world.gravity.set(0, -18, 0); 

        const bW = 12, bH = 1.2, bD = 2.0, katSayisi = 20, blokSayisi = 6; 
        let jengaMeshes = [], jengaBodies = [];
        let meteorMeshes = [], meteorBodies = [];

        // Görünmez Fiziksel Platform
        const floorShape = new CANNON.Box(new CANNON.Vec3(20, 0.5, 20));
        const floorBody = new CANNON.Body({ mass: 0, shape: floorShape });
        floorBody.position.set(0, -0.5, 0);
        floorBody.collisionFilterGroup = 2;
        floorBody.collisionFilterMask = 2; 
        world.addBody(floorBody);

        // --- KULE YAPIMI ---
        function devJengaKulesiYap() {
            jengaMeshes.forEach(m => scene.remove(m));
            jengaBodies.forEach(b => world.removeBody(b));
            jengaMeshes = []; jengaBodies = [];
            const baslangicOfset = ((blokSayisi - 1) * bD) / 2;

            for (let i = 0; i < katSayisi; i++) {
                const yPos = i * bH + bH / 2;
                // Katman rengi (Texture niyetine gölgeli ahşap tonları geçişi)
                const katRengi = i % 2 === 0 ? 0xb45309 : 0xd97706;

                if (i % 2 === 0) {
                    for (let j = 0; j < blokSayisi; j++) {
                        olusturBlok(bW, bH, bD, 0, yPos, (j * bD) - baslangicOfset, katRengi);
                    }
                } else {
                    for (let j = 0; j < blokSayisi; j++) {
                        olusturBlok(bD, bH, bW, (j * bD) - baslangicOfset, yPos, 0, katRengi);
                    }
                }
            }
        }

        function olusturBlok(w, h, d, x, y, z, renk) {
            const geo = new THREE.BoxGeometry(w, h, d);
            // Roughness ve Metalness matlık/parlaklık vererek malzeme dokusu (texture) hissi yaratır
            const mat = new THREE.MeshStandardMaterial({ color: renk, roughness: 0.8, metalness: 0.1 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            jengaMeshes.push(mesh);

            const shape = new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2));
            const body = new CANNON.Body({ mass: 1.5, shape: shape });
            body.position.set(x, y, z);
            body.collisionFilterGroup = 2; 
            body.collisionFilterMask = 1 | 2; 
            world.addBody(body);
            jengaBodies.push(body);
        }
        devJengaKulesiYap();

        // OYUNCULAR
        const playerGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
        const playerMat = new THREE.MeshStandardMaterial({ color: 0x0ea5e9, roughness: 0.2, metalness: 0.5 }); // Metalik doku
        const playerMesh = new THREE.Mesh(playerGeo, playerMat);
        playerMesh.castShadow = true;
        scene.add(playerMesh);

        const playerShape = new CANNON.Box(new CANNON.Vec3(0.6, 0.6, 0.6));
        const playerBody = new CANNON.Body({ mass: 3, shape: playerShape, fixedRotation: true });
        playerBody.collisionFilterGroup = 1; playerBody.collisionFilterMask = 2; 
        world.addBody(playerBody);

        const rakipMesh = new THREE.Mesh(playerGeo, new THREE.MeshStandardMaterial({ color: 0xec4899, roughness: 0.2, metalness: 0.5 }));
        rakipMesh.castShadow = true;

        function oyuncuReset() {
            const tepeYukseklik = (katSayisi * bH) + 2;
            if(benimRolum === 'player1') playerBody.position.set(-2, tepeYukseklik, 0);
            else playerBody.position.set(2, tepeYukseklik, 0);
            playerBody.velocity.set(0, 0, 0);
            document.getElementById("olumEkrani").style.display = "none";
        }

        // --- AFET MEKANİKLERİ ---
        function uyariGoster(isim) {
            const el = document.getElementById("afetUyarisi");
            el.innerText = `⚠️ AFET: ${isim} BAŞLADI! ⚠️`;
            el.style.display = "block";
            setTimeout(() => { el.style.display = "none"; }, 4000);
        }

        // 🌋 Afet Tetikleyici (Her 12 saniyede bir rastgele afet seçer - Sadece p1 yönetir, odaya yayınlar)
        function afetYonetici() {
            if (!oyunBasladi) return;
            const afetler = ["DEPREM", "METEOR"];
            const secilen = afetler[Math.floor(Math.random() * afetler.length)];
            
            let veri = { isim: secilen };
            if (secilen === "DEPREM") veri.guc = 4 + Math.random() * 5;
            if (secilen === "METEOR") { veri.x = (Math.random() - 0.5) * 15; veri.z = (Math.random() - 0.5) * 15; }

            socket.emit('afetYayinla', veri); // Sunucuya gönder, o da herkese yaysın (Aşağıdaki server koduna bunu ekledik)
            socket.emit('hareketEt', {}); // Senkronizasyon tetiklemesi
            
            // P1 kendi ekranında da çalıştırır
            uyariGoster(veri.isim);
            if (secilen === "DEPREM") depremEfekti(veri.guc);
            if (secilen === "METEOR") meteorFirlat(veri.x, veri.z);

            setTimeout(afetYonetici, 12000); // 12 Saniyede bir yeni afet
        }

        // 1. DEPREM FONKSİYONU
        let sarsintiZamani = 0, depremGucu = 0;
        function depremEfekti(guc) {
            depremGucu = guc;
            sarsintiZamani = 180; // 3 saniye sürecek sarsıntı (60fps * 3)
            
            // Jenga bloklarına rastgele anlık itme kuvvetleri uygula
            jengaBodies.forEach(body => {
                body.velocity.x += (Math.random() - 0.5) * guc;
                body.velocity.z += (Math.random() - 0.5) * guc;
            });
        }

        // 2. METEOR FONKSİYONU
        function meteorFirlat(x, z) {
            // Görsel Akkor Volkanik Taş Dokusu
            const metGeo = new THREE.SphereGeometry(1.5, 16, 16);
            const metMat = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0x7f1d1d, roughness: 0.9 });
            const mesh = new THREE.Mesh(metGeo, metMat);
            mesh.castShadow = true;
            scene.add(mesh);
            meteorMeshes.push(mesh);

            // Fiziksel Meteor
            const shape = new CANNON.Sphere(1.5);
            const body = new CANNON.Body({ mass: 12, shape: shape }); // Çok ağır, çarptığı yeri yıkar!
            body.position.set(x, (katSayisi * bH) + 20, z); // Kulenin yukarısında belirir
            body.velocity.set((Math.random() - 0.5) * 5, -25, (Math.random() - 0.5) * 5); // Aşağı doğru fırlatılır
            
            // Meteorlar her şeyle çarpışabilir
            body.collisionFilterGroup = 2;
            body.collisionFilterMask = 1 | 2;
            world.addBody(body);
            meteorBodies.push(body);
        }

        // KONTROLLER
        const keys = { w: false, s: false, a: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
        let canJump = false;
        const HIZ = 10, ZIPLAMA_GUCU = 10;

        window.addEventListener('keydown', (e) => { 
            if (e.key in keys) keys[e.key] = true; 
            if (e.key === ' ' && canJump && oyunBasladi) { playerBody.velocity.y = ZIPLAMA_GUCU; canJump = false; }
        });
        window.addEventListener('keyup', (e) => { if (e.key in keys) keys[e.key] = false; });

        // DÖNGÜ
        const timeStep = 1 / 60;
        function animate() {
            requestAnimationFrame(animate);
            world.step(timeStep);

            playerMesh.position.copy(playerBody.position);

            // Jengaları Eşitle
            for (let i = 0; i < jengaMeshes.length; i++) {
                jengaMeshes[i].position.copy(jengaBodies[i].position);
                jengaMeshes[i].quaternion.copy(jengaBodies[i].quaternion);
            }

            // Meteorları Eşitle
            for (let i = 0; i < meteorBodies.length; i++) {
                meteorMeshes[i].position.copy(meteorBodies[i].position);
                meteorMeshes[i].quaternion.copy(meteorBodies[i].quaternion);
                // Çok aşağı düşen meteorları temizle (Performans için)
                if (meteorBodies[i].position.y < -20) {
                    scene.remove(meteorMeshes[i]);
                    world.removeBody(meteorBodies[i]);
                    meteorBodies.splice(i, 1);
                    meteorMeshes.splice(i, 1);
                    i--;
                }
            }

            // Deprem Ekran Sarsıntısı Hesaplaması
            if (sarsintiZamani > 0) {
                sarsintiZamani--;
                camera.position.x += (Math.random() - 0.5) * (depremGucu * 0.05);
                camera.position.y += (Math.random() - 0.5) * (depremGucu * 0.05);
            }

            if (oyunBasladi) {
                let moveX = 0, moveZ = 0;
                if (keys.w || keys.ArrowUp) moveZ = -HIZ;
                if (keys.s || keys.ArrowDown) moveZ = HIZ;
                if (keys.a || keys.ArrowLeft) moveX = -HIZ;
                if (keys.d || keys.ArrowRight) moveX = HIZ;

                playerBody.velocity.x = moveX;
                playerBody.velocity.z = moveZ;

                socket.emit('hareketEt', { x: playerBody.position.x, y: playerBody.position.y, z: playerBody.position.z });
            }

            if (Math.abs(playerBody.velocity.y) < 0.05) canJump = true;

            // 💀 ÖLÜM KONTROLÜ
            if (playerBody.position.y < -5.5 && oyunBasladi) {
                oyunBasladi = false;
                document.getElementById("olumEkrani").style.display = "flex";
                setTimeout(() => {
                    devJengaKulesiYap();
                    oyunBasladi = true;
                    oyuncuReset();
                }, 3000);
            }

            // Kamera Takip
            if (sarsintiZamani <= 0) {
                camera.position.set(playerMesh.position.x, playerMesh.position.y + 12, playerMesh.position.z + 22);
            }
            camera.lookAt(playerMesh.position.x, playerMesh.position.y - 2, playerMesh.position.z);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
